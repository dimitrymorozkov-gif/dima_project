name: Offline checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m pytest -q
      - run: python -m game_agent.simulation --input data/simulated_answers.csv --output work/demo --db work/demo.sqlite3
      - run: python -m game_agent.simulation --input data/simulation_edge_cases.csv --output work/edge --db work/edge.sqlite3
